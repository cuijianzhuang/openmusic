name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '远程站点 URL（与 CLIENT_URL 一致）'
        required: true
        default: 'https://qqovo.top'
      build_type:
        description: '构建类型'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      bump_version:
        description: '打包前自增 versionCode / versionName 并回写仓库'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 允许后续把版本 bump 推回当前分支
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Bump Android version
        id: bump
        if: ${{ inputs.bump_version }}
        run: node scripts/bump-android-version.mjs
        working-directory: client

      - name: Sync Capacitor (remote URL)
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: npm run cap:sync:android
        working-directory: client

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
        working-directory: client

      - name: Prepare APK
        run: cp "client/android/app/build/outputs/apk/${{ inputs.build_type }}/"*.apk openmusic.apk
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openmusic-${{ inputs.build_type }}-${{ steps.bump.outputs.version_name || github.run_number }}
          path: openmusic.apk
          if-no-files-found: error

      - name: Commit version bump
        if: ${{ inputs.bump_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/android/app/build.gradle
          if git diff --staged --quiet; then
            echo "无版本变更，跳过提交"
            exit 0
          fi
          NAME="${{ steps.bump.outputs.version_name }}"
          CODE="${{ steps.bump.outputs.version_code }}"
          git commit -m "chore(android): bump to ${NAME} (${CODE})"
          # 推回触发本次 workflow 的分支，供下次打包继续自增
          git push origin "HEAD:${GITHUB_REF_NAME}"
