name: Flutter Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '后端站点 URL（写入 OM_SERVER_URL）'
        required: true
        default: 'https://qqovo.top'
      build_type:
        description: '构建类型'
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platform folders
        working-directory: mobile
        run: |
          flutter create --platforms=android,ios --org=com.openmusic --project-name=openmusic .
          flutter pub get

      - name: Build APK
        working-directory: mobile
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            flutter build apk --release --dart-define=OM_SERVER_URL=${{ inputs.server_url }}
            cp build/app/outputs/flutter-apk/app-release.apk ../openmusic.apk
          else
            flutter build apk --debug --dart-define=OM_SERVER_URL=${{ inputs.server_url }}
            cp build/app/outputs/flutter-apk/app-debug.apk ../openmusic.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openmusic-apk
          path: openmusic.apk

      - name: Publish to server/downloads
        run: |
          mkdir -p server/downloads
          cp openmusic.apk server/downloads/openmusic.apk
