name: Flutter iOS IPA

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '后端站点 URL（写入 OM_SERVER_URL）'
        required: true
        default: 'https://your-host'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platforms & deps
        working-directory: mobile
        run: |
          flutter create --platforms=android,ios --org=com.openmusic --project-name=openmusic .
          flutter pub get

      - name: Build IPA (no signing)
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=OM_SERVER_URL=${{ inputs.server_url }}
          # Unsigned .app for sideload tooling; full IPA needs Apple cert secrets.
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../../openmusic-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: openmusic-ipa-unsigned
          path: openmusic-unsigned.ipa
