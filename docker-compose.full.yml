# 全量版：OpenMusic + Redis + Meting-API。生产环境需在 Meting 前配置 HTTPS 反代。
# 用法：docker compose -f docker-compose.full.yml up -d
#
# Meting 管理后台：http://<IP>:3000/admin
# 默认账号见下方 ADMIN_USERNAME / ADMIN_PASSWORD（仅首次无数据时生效）

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meting:
    image: w3126197382/meting-api:latest
    restart: unless-stopped
    ports:
      - "${METING_PORT:-3000}:3000"
      environment:
        ADMIN_PATH: ${METING_ADMIN_PATH:-admin}
        ADMIN_USERNAME: ${METING_ADMIN_USERNAME:-admin}
        ADMIN_PASSWORD: ${METING_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data/meting:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3

  openmusic:
    image: w3126197382/openmusic:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OPENMUSIC_PORT:-4000}:4000"
    environment:
      PORT: 4000
      DOCKER_REDIS_URL: redis://redis:6379/0
      DOCKER_METING_URL: ${METING_API_URL:-https://meting.example.com}
      ROOM_CREDENTIAL_ENCRYPTION_KEY: ${ROOM_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - ./data/.env:/app/server/.env
      - ./data/runtimeConfig.json:/app/server/runtimeConfig.json
      - ./data/adminConfig.json:/app/server/adminConfig.json
      - ./data/setup.lock:/app/server/setup.lock
      - ./data/downloads:/app/server/downloads
    depends_on:
      redis:
        condition: service_healthy
      meting:
        condition: service_healthy

volumes:
  redis-data:
