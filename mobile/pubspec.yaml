name: openmusic
description: OpenMusic native client — collaborative listening (Android & iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  socket_io_client: ^3.0.2
  just_audio: ^0.9.46
  audio_service: ^0.18.16
  audio_session: ^0.1.25
  audio_video_progress_bar: ^2.0.3
  flutter_lyric: ^3.0.7
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2
  path_provider: ^2.1.6
  connectivity_plus: ^6.1.4
  flutter_inappwebview: ^6.1.5
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon.png
